<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Assistant - 个人知识库助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      color: white;
      padding: 30px 0;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      opacity: 0.9;
      font-size: 1.1rem;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .chat-section, .knowledge-section {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .chat-section {
      display: flex;
      flex-direction: column;
      height: 70vh;
    }

    .chat-header, .knowledge-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h2, .knowledge-header h2 {
      font-size: 1.3rem;
      color: #333;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #f5f5f5;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .message.sources {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    .chat-input {
      padding: 20px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus {
      border-color: #667eea;
    }

    .chat-input button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .chat-input button:hover {
      transform: scale(1.05);
    }

    .chat-input button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .knowledge-section {
      display: flex;
      flex-direction: column;
    }

    .knowledge-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .upload-area {
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .upload-area.dragover {
      border-color: #667eea;
      background: #f0f2ff;
    }

    .upload-area p {
      color: #666;
      margin-bottom: 10px;
    }

    .upload-area input {
      display: none;
    }

    .document-list {
      list-style: none;
    }

    .document-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      background: #f8f9fa;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .document-item:hover {
      background: #f0f2ff;
    }

    .document-item button {
      padding: 6px 12px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .document-item button:hover {
      background: #ff3344;
    }

    .stats {
      padding: 15px 20px;
      background: #f8f9fa;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #666;
    }

    .session-selector {
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
    }

    .session-selector select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
    }

    .loading::before {
      content: '';
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state p {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 RAG Assistant</h1>
      <p>基于检索增强的个人知识库助手</p>
    </header>

    <div class="main-content">
      <!-- 聊天区域 -->
      <div class="chat-section">
        <div class="chat-header">
          <h2>💬 智能问答</h2>
          <span id="sessionId"></span>
        </div>

        <div class="session-selector">
          <select id="sessionSelect" onchange="switchSession()">
            <option value="">开始新对话</option>
          </select>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="empty-state">
            <p>👋 你好！我是你的知识库助手</p>
            <p>在左侧上传文档，然后向我提问吧！</p>
          </div>
        </div>

        <div class="chat-input">
          <input
            type="text"
            id="questionInput"
            placeholder="输入你的问题..."
            onkeypress="handleKeyPress(event)"
          >
          <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
      </div>

      <!-- 知识库区域 -->
      <div class="knowledge-section">
        <div class="knowledge-header">
          <h2>📚 知识库</h2>
          <button onclick="refreshDocuments()" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">刷新</button>
        </div>

        <div class="knowledge-content">
          <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept=".pdf,.md,.markdown,.txt,.text,.docx,.py,.js,.ts,.java,.go,.rs" onchange="handleFileSelect(event)">
            <p>📁 点击上传</p>
            <p style="font-size: 0.85rem; color: #999;">支持拖拽上传</p>
            <p style="font-size: 0.8rem; color: #ccc;">PDF, Markdown, TXT, DOCX, 代码文件</p>
          </div>

          <ul class="document-list" id="documentList">
            <!-- 文档列表 -->
          </ul>
        </div>

        <div class="stats" id="stats">
          加载中...
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
