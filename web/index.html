<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --sidebar-width: 260px;
      --sidebar-bg: #f9f9f9;
      --main-bg: #ffffff;
      --border-color: #e5e5e5;
      --text-primary: #0d0d0d;
      --text-secondary: #6e6e6e;
      --text-muted: #999;
      --hover-bg: #ececec;
      --active-bg: #e3e3e3;
      --input-bg: #f4f4f4;
      --input-border: #e0e0e0;
      --accent: #10a37f;
      --accent-hover: #0d8c6d;
      --danger: #ef4146;
      --code-bg: rgba(0, 0, 0, 0.06);
      --pre-bg: #1e1e1e;
      --pre-color: #d4d4d4;
      --user-bubble-bg: #f4f4f4;
      --send-btn-bg: #0d0d0d;
      --send-btn-hover: #333;
      --scrollbar-thumb: #ccc;
      --th-bg: #f5f5f5;
      --shadow: rgba(0,0,0,0.1);
    }

    [data-theme="dark"] {
      --sidebar-bg: #171717;
      --main-bg: #212121;
      --border-color: #2d2d2d;
      --text-primary: #ececec;
      --text-secondary: #b4b4b4;
      --text-muted: #777;
      --hover-bg: #2d2d2d;
      --active-bg: #363636;
      --input-bg: #2f2f2f;
      --input-border: #3d3d3d;
      --accent: #10a37f;
      --accent-hover: #0d8c6d;
      --danger: #ef4146;
      --code-bg: rgba(255, 255, 255, 0.1);
      --pre-bg: #0d0d0d;
      --pre-color: #d4d4d4;
      --user-bubble-bg: #2f2f2f;
      --send-btn-bg: #ececec;
      --send-btn-hover: #fff;
      --scrollbar-thumb: #555;
      --th-bg: #2d2d2d;
      --shadow: rgba(0,0,0,0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--main-bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    /* ===== Layout ===== */
    .app {
      display: flex;
      height: 100vh;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.2s ease, opacity 0.2s ease;
      overflow: hidden;
    }

    .sidebar.collapsed {
      margin-left: calc(-1 * var(--sidebar-width));
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-header {
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    .new-chat-btn {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--main-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-primary);
      transition: background 0.15s;
    }

    .new-chat-btn:hover {
      background: var(--hover-bg);
    }

    .new-chat-btn svg {
      width: 18px;
      height: 18px;
    }

    .sidebar-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.15s;
    }

    .sidebar-toggle-btn:hover {
      background: var(--hover-bg);
    }

    .sidebar-toggle-btn svg {
      width: 18px;
      height: 18px;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .conversation-list::-webkit-scrollbar {
      width: 4px;
    }

    .conversation-list::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    .conversation-group-label {
      padding: 10px 12px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .conversation-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-primary);
      transition: background 0.15s;
      position: relative;
      gap: 8px;
    }

    .conversation-item:hover {
      background: var(--hover-bg);
    }

    .conversation-item.active {
      background: var(--active-bg);
    }

    .conversation-item .conv-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-item .delete-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }

    .conversation-item:hover .delete-btn {
      display: flex;
    }

    .conversation-item .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 65, 70, 0.1);
    }

    .conversation-item .delete-btn svg {
      width: 14px;
      height: 14px;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .theme-toggle-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.8rem;
      width: 100%;
      transition: background 0.15s, color 0.15s;
    }

    .theme-toggle-btn:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .model-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .model-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--scrollbar-thumb);
      flex-shrink: 0;
    }

    .model-status.loaded .model-status-dot { background: #22c55e; }
    .model-status.unloaded .model-status-dot { background: #f59e0b; }
    .model-status.loading .model-status-dot { background: var(--accent); animation: pulse 1s infinite; }
    .model-status.error .model-status-dot { background: var(--danger); }

    .model-status-text { flex: 1; }

    .warmup-btn {
      padding: 4px 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .warmup-btn:hover { background: var(--accent-hover); }
    .warmup-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== Main Area ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 8px;
      border-bottom: 1px solid transparent;
    }

    .toggle-sidebar-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.15s;
    }

    .sidebar.collapsed ~ .main .toggle-sidebar-btn {
      display: flex;
    }

    .toggle-sidebar-btn:hover {
      background: var(--hover-bg);
    }

    .toggle-sidebar-btn svg {
      width: 20px;
      height: 20px;
    }

    .top-bar-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ===== Chat Messages ===== */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .chat-area::-webkit-scrollbar {
      width: 6px;
    }

    .chat-area::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    /* Welcome screen */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .welcome-title {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Messages container */
    .messages-container {
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 0;
    }

    .message-row {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      max-width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .message-avatar.assistant-avatar {
      background: var(--accent);
      color: white;
    }

    .message-avatar.user-avatar {
      background: #ab68ff;
      color: white;
    }

    .message-content {
      flex: 1;
      min-width: 0;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .message-row.user .message-content {
      flex: unset;
      max-width: 70%;
      background: var(--user-bubble-bg);
      padding: 10px 16px;
      border-radius: 18px;
      white-space: pre-wrap;
    }

    /* Markdown content */
    .markdown-content {
      line-height: 1.7;
    }

    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4 {
      margin-top: 1em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }

    .markdown-content h1 { font-size: 1.4em; }
    .markdown-content h2 { font-size: 1.2em; }
    .markdown-content h3 { font-size: 1.05em; }

    .markdown-content p {
      margin-bottom: 0.75em;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin-left: 1.5em;
      margin-bottom: 0.75em;
    }

    .markdown-content code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.88em;
    }

    .markdown-content pre {
      background: var(--pre-bg);
      color: var(--pre-color);
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .markdown-content pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    .markdown-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 10px 0;
      color: var(--text-secondary);
    }

    .markdown-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
    }

    .markdown-content th,
    .markdown-content td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-content th {
      background: var(--th-bg);
      font-weight: 600;
    }

    /* Sources */
    .sources {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .sources strong {
      color: var(--text-primary);
    }

    /* Thinking indicator */
    .thinking-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .thinking-indicator .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: thinking-bounce 1.4s infinite ease-in-out both;
    }

    .thinking-indicator .dot:nth-child(2) { animation-delay: -0.32s; }
    .thinking-indicator .dot:nth-child(3) { animation-delay: -0.16s; }

    @keyframes thinking-bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Typing cursor */
    .typing-cursor::after {
      content: '▌';
      animation: blink 1s step-end infinite;
      color: var(--text-primary);
      font-weight: 400;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* ===== Input Area ===== */
    .input-area {
      padding: 16px 20px 24px;
      display: flex;
      justify-content: center;
    }

    .input-wrapper {
      max-width: 768px;
      width: 100%;
      position: relative;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 24px;
      display: flex;
      align-items: flex-end;
      padding: 8px 12px 8px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--scrollbar-thumb);
      box-shadow: 0 0 0 1px var(--scrollbar-thumb);
    }

    .input-wrapper textarea {
      flex: 1;
      border: none;
      background: none;
      outline: none;
      resize: none;
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 200px;
      padding: 6px 0;
      font-family: inherit;
      color: var(--text-primary);
    }

    .input-wrapper textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--send-btn-bg);
      border-radius: 50%;
      cursor: pointer;
      color: var(--main-bg);
      flex-shrink: 0;
      transition: opacity 0.15s, background 0.15s;
      margin-left: 4px;
    }

    .send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .send-btn:not(:disabled):hover {
      background: var(--send-btn-hover);
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Upload button */
    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }

    .upload-btn:hover {
      color: var(--text-primary);
      background: var(--hover-bg);
    }

    .upload-btn svg {
      width: 18px;
      height: 18px;
    }

    .upload-btn input[type="file"] {
      display: none;
    }

    /* Upload progress */
    .upload-progress {
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px 8px;
      display: none;
    }

    .upload-progress.active {
      display: block;
    }

    .upload-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--hover-bg);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .upload-progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s ease;
      border-radius: 2px;
    }

    .upload-progress-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* File preview chip */
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--hover-bg);
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      max-width: 768px;
      margin: 0 auto 8px;
    }

    .file-chip .file-chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .file-chip .file-chip-remove {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }

    .file-chip .file-chip-remove:hover {
      color: var(--danger);
      background: rgba(239, 65, 70, 0.1);
    }

    /* ===== Notification ===== */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 10px;
      color: white;
      z-index: 10000;
      font-size: 0.875rem;
      animation: slideIn 0.25s ease;
    }

    .notification-success { background: #22c55e; }
    .notification-error { background: var(--danger); }
    .notification-info { background: #667eea; }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 100;
        box-shadow: 4px 0 20px var(--shadow);
      }

      .sidebar.collapsed {
        box-shadow: none;
      }

      .toggle-sidebar-btn {
        display: flex !important;
      }

      .message-row.user .message-content {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="startNewChat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          新对话
        </button>
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="收起侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
      </div>

      <div class="conversation-list" id="conversationList">
        <!-- Conversation items rendered by JS -->
      </div>

      <div class="sidebar-footer">
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="切换主题">
          <svg id="themeIconLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="themeIconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="display:none;">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
          </svg>
          <span id="themeLabel">暗夜模式</span>
        </button>
        <div id="modelStatus" class="model-status">
          <span class="model-status-dot"></span>
          <span class="model-status-text">检测模型中...</span>
          <button id="warmupBtn" class="warmup-btn" onclick="warmupModel()" style="display:none;">启动</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="top-bar">
        <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="展开侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <span class="top-bar-title">RAG Assistant</span>
      </div>

      <div class="chat-area" id="chatArea">
        <!-- Welcome screen or messages -->
        <div class="welcome" id="welcomeScreen">
          <h1 class="welcome-title">有什么可以帮你的？</h1>
        </div>
      </div>

      <div class="upload-progress" id="uploadProgress">
        <div class="upload-progress-bar">
          <div class="upload-progress-fill" id="uploadProgressFill" style="width: 0%"></div>
        </div>
        <div class="upload-progress-text">
          <span id="uploadProgressStage">准备上传...</span>
          <span id="uploadProgressPercent">0%</span>
        </div>
      </div>

      <div style="max-width: 768px; width: 100%; margin: 0 auto; padding: 0 20px;" id="fileChipArea"></div>

      <div class="input-area">
        <div class="input-wrapper">
          <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="上传文档">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
            </svg>
            <input type="file" id="fileInput" accept=".pdf,.md,.markdown,.txt,.text,.docx,.py,.js,.ts,.java,.go,.rs" onchange="handleFileSelect(event)">
          </button>
          <textarea
            id="messageInput"
            rows="1"
            placeholder="给 RAG Assistant 发消息"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
