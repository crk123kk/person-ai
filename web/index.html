<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Assistant - 个人知识库助手</title>
  <!-- Markdown 渲染 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      color: white;
      padding: 30px 0;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      opacity: 0.9;
      font-size: 1.1rem;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .chat-section, .knowledge-section {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .chat-section {
      display: flex;
      flex-direction: column;
      height: 85vh;
      max-height: 800px;
    }

    .chat-header, .knowledge-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h2, .knowledge-header h2 {
      font-size: 1.3rem;
      color: #333;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #f5f5f5;
      color: #333;
      border-bottom-left-radius: 4px;
      max-height: none;
      overflow-y: visible;
    }

    /* Markdown 内容样式 */
    .message.assistant .markdown-content {
      line-height: 1.7;
    }
    .message.assistant .markdown-content h1,
    .message.assistant .markdown-content h2,
    .message.assistant .markdown-content h3,
    .message.assistant .markdown-content h4 {
      margin-top: 1em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }
    .message.assistant .markdown-content h1 { font-size: 1.5em; }
    .message.assistant .markdown-content h2 { font-size: 1.3em; }
    .message.assistant .markdown-content h3 { font-size: 1.1em; }
    .message.assistant .markdown-content p {
      margin-bottom: 0.8em;
    }
    .message.assistant .markdown-content ul,
    .message.assistant .markdown-content ol {
      margin-left: 1.5em;
      margin-bottom: 0.8em;
    }
    .message.assistant .markdown-content code {
      background: rgba(0,0,0,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.9em;
    }
    .message.assistant .markdown-content pre {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .message.assistant .markdown-content pre code {
      background: transparent;
      padding: 0;
    }
    .message.assistant .markdown-content blockquote {
      border-left: 3px solid #667eea;
      padding-left: 12px;
      margin: 10px 0;
      color: #666;
    }
    .message.assistant .markdown-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
    }
    .message.assistant .markdown-content th,
    .message.assistant .markdown-content td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    .message.assistant .markdown-content th {
      background: #f0f0f0;
      font-weight: 600;
    }

    .message.sources {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    /* 流式输出光标效果 */
    .typing-cursor::after {
      content: '|';
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .chat-input {
      padding: 20px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus {
      border-color: #667eea;
    }

    .chat-input button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .chat-input button:hover {
      transform: scale(1.05);
    }

    .chat-input button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .knowledge-section {
      display: flex;
      flex-direction: column;
    }

    .knowledge-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .upload-area {
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .upload-area.dragover {
      border-color: #667eea;
      background: #f0f2ff;
    }

    .upload-area p {
      color: #666;
      margin-bottom: 10px;
    }

    .upload-area input {
      display: none;
    }

    .document-list {
      list-style: none;
    }

    .document-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      background: #f8f9fa;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .document-item:hover {
      background: #f0f2ff;
    }

    .document-item button {
      padding: 6px 12px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .document-item button:hover {
      background: #ff3344;
    }

    .stats {
      padding: 15px 20px;
      background: #f8f9fa;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #666;
    }

    .session-selector {
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
    }

    .session-selector select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
    }

    .loading::before {
      content: '';
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 进度条样式 */
    .progress-container {
      margin-top: 15px;
      display: none;
    }

    .progress-container.active {
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s ease;
      border-radius: 4px;
    }

    .progress-status {
      font-size: 0.85rem;
      color: #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-stage {
      font-size: 0.8rem;
      color: #999;
    }

    .progress-stage.completed {
      color: #22c55e;
    }

    .progress-stage.processing {
      color: #667eea;
      font-weight: 500;
    }

    .stage-indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .stage-indicator.completed {
      background: #22c55e;
    }

    .stage-indicator.processing {
      background: #667eea;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state p {
      margin-top: 10px;
    }

    /* 思考动画 */
    .thinking-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      color: #667eea;
      font-size: 0.95rem;
    }

    .thinking-indicator .thinking-text {
      margin-right: 2px;
    }

    .thinking-indicator .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #667eea;
      animation: thinking-bounce 1.4s infinite ease-in-out both;
    }

    .thinking-indicator .dot:nth-child(2) {
      animation-delay: -0.32s;
    }

    .thinking-indicator .dot:nth-child(3) {
      animation-delay: -0.16s;
    }

    @keyframes thinking-bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* 模型状态 */
    .model-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #f8f9fa;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }

    .model-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }

    .model-status.loaded .model-status-dot { background: #22c55e; }
    .model-status.unloaded .model-status-dot { background: #f59e0b; }
    .model-status.loading .model-status-dot { background: #667eea; animation: pulse 1s infinite; }
    .model-status.error .model-status-dot { background: #ff4757; }

    .model-status-text { flex: 1; color: #555; }

    .warmup-btn {
      padding: 5px 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .warmup-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 RAG Assistant</h1>
      <p>基于检索增强的个人知识库助手</p>
    </header>

    <div class="main-content">
      <!-- 聊天区域 -->
      <div class="chat-section">
        <div class="chat-header">
          <h2>💬 智能问答</h2>
          <span id="sessionId"></span>
        </div>

        <div class="session-selector">
          <select id="sessionSelect" onchange="switchSession()">
            <option value="">开始新对话</option>
          </select>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="empty-state">
            <p>👋 你好！我是你的知识库助手</p>
            <p>在左侧上传文档，然后向我提问吧！</p>
          </div>
        </div>

        <div class="chat-input">
          <input
            type="text"
            id="questionInput"
            placeholder="输入你的问题..."
            onkeypress="handleKeyPress(event)"
          >
          <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
      </div>

      <!-- 知识库区域 -->
      <div class="knowledge-section">
        <div class="knowledge-header">
          <h2>📚 知识库</h2>
          <button onclick="refreshDocuments()" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">刷新</button>
        </div>

        <div class="knowledge-content">
          <!-- 模型状态 -->
          <div id="modelStatus" class="model-status">
            <span class="model-status-dot"></span>
            <span class="model-status-text">检测模型中...</span>
            <button id="warmupBtn" class="warmup-btn" onclick="warmupModel()" style="display:none;">启动模型</button>
          </div>

          <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept=".pdf,.md,.markdown,.txt,.text,.docx,.py,.js,.ts,.java,.go,.rs" onchange="handleFileSelect(event)">
            <p>📁 点击上传</p>
            <p style="font-size: 0.85rem; color: #999;">支持拖拽上传</p>
            <p style="font-size: 0.8rem; color: #ccc;">PDF, Markdown, TXT, DOCX, 代码文件</p>

            <!-- 进度条容器 -->
            <div class="progress-container" id="progressContainer">
              <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
              </div>
              <div class="progress-status">
                <span id="progressPercent">0%</span>
                <span id="progressStage" class="progress-stage">准备上传...</span>
              </div>
            </div>
          </div>

          <ul class="document-list" id="documentList">
            <!-- 文档列表 -->
          </ul>
        </div>

        <div class="stats" id="stats">
          加载中...
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
